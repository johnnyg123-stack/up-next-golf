<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Up Next Golf · Player Directory</title>
<style>
  :root {
    --bg: #0f1117;
    --bg-soft: #171a23;
    --bg-card: #151824;
    --fg: #e8eaf0;
    --muted: #8b90a0;
    --faint: #565c70;
    --accent: #6ee7b7;
    --accent-dim: #2b6a52;
    --accent-ink: #06281c;
    --line: #262a38;
    --line-soft: #20242f;
    --danger: #f87171;
    --warn: #fbbf24;
    --gold: #fcd34d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(1200px 800px at 50% -10%, #1b2030 0%, var(--bg) 55%);
    color: var(--fg); min-height: 100%; -webkit-font-smoothing: antialiased; line-height: 1.45;
  }
  button, input, textarea, select { font-family: inherit; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 24px 20px 80px; }

  header.top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; gap: 12px; }
  .brand { font-size: 13px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--muted); cursor: pointer; }
  .brand b { color: var(--accent); font-weight: 600; }
  #nav { display: flex; gap: 8px; align-items: center; }

  h1.page-title { font-size: 24px; font-weight: 600; margin-bottom: 4px; }
  .subtle { color: var(--muted); font-size: 14px; }
  .intro { color: var(--muted); font-size: 14px; margin: 8px 0 18px; max-width: 60ch; }

  .search {
    width: 100%; background: var(--bg-soft); border: 1px solid var(--line);
    border-radius: 12px; color: var(--fg); font-size: 15px; padding: 11px 14px; outline: none; margin: 8px 0 18px;
    transition: border-color .2s, box-shadow .2s;
  }
  .search::placeholder { color: var(--faint); }
  .search:focus { border-color: var(--accent-dim); box-shadow: 0 0 0 3px rgba(110,231,183,0.12); }

  .list { display: flex; flex-direction: column; gap: 10px; }
  .row {
    display: flex; align-items: center; gap: 14px; background: var(--bg-card);
    border: 1px solid var(--line-soft); border-radius: 14px; padding: 13px 16px; cursor: pointer;
    transition: border-color .15s, transform .08s, background .15s;
  }
  .row:hover { border-color: #33394a; background: #181c28; }
  .row:active { transform: scale(0.995); }
  .avatar {
    width: 44px; height: 44px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #1f2634, #242c3d); border: 1px solid var(--line);
    color: var(--accent); font-weight: 600; font-size: 15px;
  }
  .avatar.lg { width: 64px; height: 64px; font-size: 22px; }
  .row .who { flex: 1; min-width: 0; }
  .row .name { font-size: 16px; font-weight: 500; }
  .row .meta { font-size: 13px; color: var(--muted); margin-top: 1px; }
  .tag { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 4px 9px; border-radius: 20px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .tag.you { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); font-weight: 700; }
  .empty { color: var(--faint); text-align: center; padding: 44px 16px; font-size: 14px; }
  .empty .btn { margin-top: 14px; }

  .btn {
    font-size: 14px; font-weight: 500; border: 1px solid var(--line); background: var(--bg-soft);
    color: var(--fg); padding: 10px 18px; border-radius: 11px; cursor: pointer;
    transition: transform .08s, background .15s, border-color .15s, opacity .15s; white-space: nowrap;
  }
  .btn:hover { border-color: #3a4050; background: #1e222d; }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .btn.primary:hover { background: #7ff0c4; }
  .btn.ghost { background: transparent; }
  .btn.danger { color: var(--danger); border-color: #4a2626; }
  .btn.danger:hover { background: rgba(248,113,113,0.08); }
  .btn.sm { padding: 7px 12px; font-size: 13px; border-radius: 9px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .link { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; padding: 4px 0; }
  .link:hover { color: var(--fg); }

  .back { margin-bottom: 18px; }
  .profile-head { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
  .profile-head h1 { font-size: 26px; font-weight: 600; }
  .profile-head .meta { color: var(--muted); font-size: 14px; margin-top: 2px; }

  .statrow { display: flex; gap: 10px; flex-wrap: wrap; margin: 6px 0; }
  .statchip { border: 1px solid var(--line-soft); background: var(--bg-soft); border-radius: 11px; padding: 8px 12px; min-width: 92px; }
  .statchip .k { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
  .statchip .v { font-size: 15px; font-weight: 600; margin-top: 2px; }
  .statchip .v.accent { color: var(--accent); }

  .card { background: var(--bg-card); border: 1px solid var(--line-soft); border-radius: 16px; padding: 20px; margin-top: 20px; }
  .card h2 { font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }

  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; letter-spacing: .04em; }
  .field input, .field textarea, .field select {
    width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; color: var(--fg);
    font-size: 14px; padding: 10px 12px; outline: none; transition: border-color .2s;
  }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent-dim); }
  .field.full { grid-column: 1 / -1; }
  .field textarea { resize: vertical; min-height: 64px; }
  .req { color: var(--accent); }

  .sched { display: flex; flex-direction: column; gap: 10px; }
  .event { display: flex; align-items: center; gap: 14px; border: 1px solid var(--line-soft); border-radius: 12px; padding: 12px 14px; background: var(--bg-soft); }
  .event.past { opacity: .55; }
  .event .date { flex: none; text-align: center; width: 52px; border-right: 1px solid var(--line); padding-right: 12px; }
  .event .date .m { font-size: 11px; text-transform: uppercase; color: var(--accent); letter-spacing: .08em; }
  .event .date .d { font-size: 20px; font-weight: 600; }
  .event .date .y { font-size: 11px; color: var(--faint); }
  .event .body { flex: 1; min-width: 0; }
  .event .t-name { font-size: 15px; font-weight: 500; }
  .event .t-loc { font-size: 13px; color: var(--muted); }
  .event .t-result { font-size: 12px; color: var(--accent); margin-top: 2px; }

  .add-form { display: grid; grid-template-columns: 150px 1fr; gap: 12px; margin-top: 8px; }
  .add-form .field.wide { grid-column: 1 / -1; }
  .form-actions { display: flex; gap: 10px; margin-top: 16px; justify-content: flex-end; align-items: center; }
  .msg { font-size: 13px; min-height: 16px; }
  .msg.err { color: var(--danger); }
  .msg.ok { color: var(--accent); }

  /* Auth + notices */
  .auth-card { max-width: 400px; margin: 30px auto; background: var(--bg-card); border: 1px solid var(--line); border-radius: 18px; padding: 26px; }
  .auth-card h1 { font-size: 20px; margin-bottom: 6px; text-align: center; }
  .auth-card p.sub { color: var(--muted); font-size: 13px; text-align: center; margin-bottom: 18px; }
  .auth-card .field { margin-bottom: 14px; }
  .auth-card .btn { width: 100%; justify-content: center; }
  .auth-toggle { text-align: center; margin-top: 16px; font-size: 13px; color: var(--muted); }
  .notice { border: 1px solid var(--line); background: var(--bg-soft); border-radius: 14px; padding: 18px 20px; margin-top: 16px; color: var(--muted); font-size: 14px; }
  .notice.warn { border-color: #3a3416; background: rgba(251,191,36,0.06); color: var(--warn); }
  .notice code { background: #0c0e14; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; color: var(--fg); font-size: 13px; }
  .notice ol { margin: 10px 0 0 18px; color: var(--fg); }
  .notice ol li { margin: 6px 0; }
  .spinner { color: var(--faint); text-align: center; padding: 44px; font-size: 14px; }

  @media (max-width: 560px) { .field-grid { grid-template-columns: 1fr; } .add-form { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand" id="brand">Up Next <b>Golf</b></div>
      <div id="nav"></div>
    </header>
    <main id="view"><div class="spinner">Loading…</div></main>
  </div>

  <!-- Supabase client + your config + the app -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=3"></script>
  <script>
  (function () {
    "use strict";

    const view = document.getElementById('view');
    const nav = document.getElementById('nav');
    const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
        ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    }
    function initials(name) {
      return (name || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('') || '?';
    }
    function parseDate(iso) { const [y,m,d] = iso.split('-').map(Number); return { y, m: m-1, d }; }
    function classOf(y) { return y ? ('Class of ' + y) : 'Class TBD'; }

    // --- Config guard: show setup screen until keys are pasted ---
    function isConfigured() {
      return window.SUPABASE_URL && window.SUPABASE_ANON_KEY &&
        !/PASTE_/.test(window.SUPABASE_URL) && !/PASTE_/.test(window.SUPABASE_ANON_KEY);
    }
    if (!isConfigured()) {
      nav.innerHTML = '';
      view.innerHTML = `
        <h1 class="page-title">Almost ready — one setup step</h1>
        <div class="notice warn">This site isn't connected to your database yet.</div>
        <div class="notice">
          Open <code>config.js</code> and paste your two Supabase values:
          <ol>
            <li>In Supabase: <b>Project Settings → API</b></li>
            <li>Copy <b>Project URL</b> → paste as <code>SUPABASE_URL</code></li>
            <li>Copy <b>anon public</b> key → paste as <code>SUPABASE_ANON_KEY</code></li>
            <li>Save and refresh this page.</li>
          </ol>
        </div>`;
      return;
    }

    const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
    let session = null;

    function updateNav() {
      if (session) {
        nav.innerHTML = `<button class="btn sm" id="nav-me">My profile</button><button class="btn sm ghost" id="nav-out">Sign out</button>`;
        document.getElementById('nav-me').onclick = () => go('#/me');
        document.getElementById('nav-out').onclick = async () => { await sb.auth.signOut(); go('#/'); };
      } else {
        nav.innerHTML = `<button class="btn sm primary" id="nav-in">Sign in</button>`;
        document.getElementById('nav-in').onclick = () => go('#/signin');
      }
    }

    function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }

    function errorBox(error) {
      return `<div class="notice warn">Couldn't load data: ${esc(error.message || error)}.<br>
        If this is your first run, make sure you ran the database setup SQL and that RLS policies are in place.</div>`;
    }

    // --- Router ---
    function route() {
      updateNav();
      const hash = location.hash || '#/';
      if (hash.startsWith('#/p/')) return renderPublicProfile(decodeURIComponent(hash.slice(4)));
      if (hash === '#/signin') return session ? go('#/me') : renderAuth();
      if (hash === '#/me') return session ? renderMyProfile() : renderAuth();
      return renderDirectory();
    }

    // --- Directory ---
    async function renderDirectory() {
      view.innerHTML = `
        <h1 class="page-title">Player directory</h1>
        <p class="intro">Junior golfers who have created their own profile. Are you a player? ${session ? 'Head to <b>My profile</b> to set yours up.' : 'Sign in to add yours.'}</p>
        <input class="search" id="search" type="text" placeholder="Search by name, hometown, or commitment…" autocomplete="off" />
        <div class="list" id="list"><div class="spinner">Loading players…</div></div>`;
      const { data, error } = await sb.from('profiles')
        .select('id,name,hometown,grad_year,commitment').order('name', { ascending: true });
      const list = document.getElementById('list');
      if (error) { list.innerHTML = errorBox(error); return; }
      const players = data || [];

      function draw(filter) {
        const q = (filter || '').trim().toLowerCase();
        const shown = players.filter(p => !q ||
          ((p.name||'') + ' ' + (p.hometown||'') + ' ' + (p.commitment||'')).toLowerCase().includes(q));
        if (!players.length) {
          list.innerHTML = `<div class="empty">No players yet — be the first!<br>
            <button class="btn primary" id="cta">${session ? 'Create my profile' : 'Sign in to create a profile'}</button></div>`;
          const cta = document.getElementById('cta');
          if (cta) cta.onclick = () => go(session ? '#/me' : '#/signin');
          return;
        }
        list.innerHTML = shown.length ? shown.map(p => `
          <div class="row" data-goto="#/p/${encodeURIComponent(p.id)}">
            <div class="avatar">${esc(initials(p.name))}</div>
            <div class="who">
              <div class="name">${esc(p.name)}</div>
              <div class="meta">${esc(classOf(p.grad_year))}${p.hometown ? ' · ' + esc(p.hometown) : ''}${p.commitment ? ' · ' + esc(p.commitment) : ''}</div>
            </div>
            ${session && p.id === session.user.id ? '<span class="tag you">You</span>' : ''}
          </div>`).join('') : '<div class="empty">No players match your search.</div>';
      }
      draw('');
      const search = document.getElementById('search');
      search.addEventListener('input', () => draw(search.value));
    }

    // --- Public profile ---
    async function renderPublicProfile(id) {
      view.innerHTML = `<button class="link back" data-goto="#/">← Back to directory</button><div class="spinner">Loading profile…</div>`;
      const { data: p, error } = await sb.from('profiles')
        .select('*, tournaments(*)').eq('id', id).single();
      if (error || !p) {
        view.innerHTML = `<button class="link back" data-goto="#/">← Back to directory</button>
          <div class="notice warn">Profile not found.</div>`;
        return;
      }
      const mine = session && session.user.id === p.id;
      const sched = (p.tournaments || []).slice().sort((a,b) => (a.date||'').localeCompare(b.date||''));
      const today = new Date().toISOString().slice(0,10);
      const schedHtml = sched.length ? sched.map(ev => {
        const past = ev.date && ev.date < today;
        const d = ev.date ? parseDate(ev.date) : null;
        const datebox = d ? `<div class="date"><div class="m">${MONTHS[d.m]}</div><div class="d">${d.d}</div><div class="y">${d.y}</div></div>`
                          : `<div class="date"><div class="m">TBD</div></div>`;
        return `<div class="event ${past?'past':''}">${datebox}
          <div class="body"><div class="t-name">${esc(ev.name)}</div>
          <div class="t-loc">${esc(ev.location)||'—'}</div>
          ${ev.result ? `<div class="t-result">Result: ${esc(ev.result)}</div>` : ''}</div></div>`;
      }).join('') : `<div class="empty">No tournaments posted yet.</div>`;

      view.innerHTML = `
        <button class="link back" data-goto="#/">← Back to directory</button>
        <div class="profile-head">
          <div class="avatar lg">${esc(initials(p.name))}</div>
          <div style="flex:1; min-width:200px;">
            <h1>${esc(p.name)}</h1>
            <div class="meta">${esc(classOf(p.grad_year))}${p.hometown ? ' · ' + esc(p.hometown) : ''}</div>
          </div>
          ${mine ? `<button class="btn primary" data-goto="#/me">Edit my profile</button>` : ''}
        </div>
        <div class="statrow">
          <div class="statchip"><div class="k">Commitment</div><div class="v accent">${esc(p.commitment || 'Uncommitted')}</div></div>
          <div class="statchip"><div class="k">Height</div><div class="v">${esc(p.height || '—')}</div></div>
          <div class="statchip"><div class="k">Weight</div><div class="v">${esc(p.weight || '—')}</div></div>
        </div>
        <div class="card"><h2>Tournament schedule</h2><div class="sched">${schedHtml}</div></div>`;
    }

    // --- Auth (email + password) ---
    let authMode = 'signin';
    function renderAuth() {
      const signup = authMode === 'signup';
      view.innerHTML = `
        <div class="auth-card">
          <h1>${signup ? 'Create your account' : 'Sign in'}</h1>
          <p class="sub">${signup ? 'Players: make an account to build your profile.' : 'Welcome back — sign in to edit your profile.'}</p>
          <div class="field"><label>Email</label><input id="a-email" type="email" autocomplete="email" placeholder="you@email.com" /></div>
          <div class="field"><label>Password</label><input id="a-pass" type="password" autocomplete="${signup?'new-password':'current-password'}" placeholder="${signup?'At least 6 characters':'Your password'}" /></div>
          <div class="msg err" id="a-msg" style="margin-bottom:12px;"></div>
          <button class="btn primary" id="a-submit">${signup ? 'Create account' : 'Sign in'}</button>
          <div class="auth-toggle">
            ${signup ? 'Already have an account?' : 'New here?'}
            <button class="link" id="a-toggle" style="display:inline; color:var(--accent);">${signup ? 'Sign in' : 'Create one'}</button>
          </div>
        </div>`;
      document.getElementById('a-toggle').onclick = () => { authMode = signup ? 'signin' : 'signup'; renderAuth(); };
      document.getElementById('a-submit').onclick = submitAuth;
      document.getElementById('a-pass').addEventListener('keydown', e => { if (e.key === 'Enter') submitAuth(); });
    }
    async function submitAuth() {
      const email = document.getElementById('a-email').value.trim();
      const password = document.getElementById('a-pass').value;
      const msg = document.getElementById('a-msg');
      const btn = document.getElementById('a-submit');
      msg.className = 'msg err'; msg.textContent = '';
      if (!email || !password) { msg.textContent = 'Enter your email and password.'; return; }
      btn.disabled = true; btn.textContent = 'Please wait…';
      try {
        if (authMode === 'signup') {
          const { data, error } = await sb.auth.signUp({ email, password });
          if (error) throw error;
          if (!data.session) {
            msg.className = 'msg ok';
            msg.textContent = 'Check your email to confirm your account, then sign in.';
            btn.disabled = false; btn.textContent = 'Create account';
            return;
          }
          go('#/me');
        } else {
          const { error } = await sb.auth.signInWithPassword({ email, password });
          if (error) throw error;
          go('#/me');
        }
      } catch (e) {
        msg.className = 'msg err';
        msg.textContent = e.message || 'Something went wrong.';
        btn.disabled = false; btn.textContent = authMode === 'signup' ? 'Create account' : 'Sign in';
      }
    }

    // --- My profile (create/edit) ---
    async function renderMyProfile() {
      view.innerHTML = `<div class="spinner">Loading your profile…</div>`;
      const uid = session.user.id;
      const { data: p, error } = await sb.from('profiles').select('*, tournaments(*)').eq('id', uid).maybeSingle();
      if (error) { view.innerHTML = errorBox(error); return; }
      const exists = !!p;
      const g = (k, d) => esc((p && p[k] != null) ? p[k] : (d || ''));
      const sched = ((p && p.tournaments) || []).slice().sort((a,b) => (a.date||'').localeCompare(b.date||''));
      const today = new Date().toISOString().slice(0,10);
      const schedHtml = sched.length ? sched.map(ev => {
        const past = ev.date && ev.date < today;
        const d = ev.date ? parseDate(ev.date) : null;
        const datebox = d ? `<div class="date"><div class="m">${MONTHS[d.m]}</div><div class="d">${d.d}</div><div class="y">${d.y}</div></div>`
                          : `<div class="date"><div class="m">TBD</div></div>`;
        return `<div class="event ${past?'past':''}">${datebox}
          <div class="body"><div class="t-name">${esc(ev.name)}</div>
          <div class="t-loc">${esc(ev.location)||'—'}</div>
          ${ev.result ? `<div class="t-result">Result: ${esc(ev.result)}</div>` : ''}</div>
          <button class="btn danger sm" data-del="${esc(ev.id)}">Remove</button></div>`;
      }).join('') : `<div class="empty">No tournaments yet — add your first below.</div>`;

      view.innerHTML = `
        <button class="link back" data-goto="#/">← Back to directory</button>
        <h1 class="page-title">${exists ? 'Edit your profile' : 'Create your profile'}</h1>
        <p class="intro">Signed in as ${esc(session.user.email)}. Only you can edit this.</p>

        <div class="card">
          <h2>Your details</h2>
          <div class="field-grid">
            <div class="field"><label>Name <span class="req">*</span></label><input id="f-name" type="text" value="${g('name')}" placeholder="First Last" /></div>
            <div class="field"><label>Hometown</label><input id="f-hometown" type="text" value="${g('hometown')}" placeholder="City, ST" /></div>
            <div class="field"><label>Graduating year</label><input id="f-grad" type="number" min="2024" max="2035" value="${g('grad_year')}" placeholder="e.g. 2027" /></div>
            <div class="field"><label>College commitment</label><input id="f-commit" type="text" value="${g('commitment')}" placeholder="School name, or Uncommitted" /></div>
            <div class="field"><label>Height</label><input id="f-height" type="text" value="${g('height')}" placeholder="e.g. 5'11&quot;" /></div>
            <div class="field"><label>Weight</label><input id="f-weight" type="text" value="${g('weight')}" placeholder="e.g. 160 lbs" /></div>
          </div>
          <div class="form-actions"><span class="msg ok" id="saveMsg"></span><button class="btn primary" id="saveProfile">${exists ? 'Save details' : 'Create profile'}</button></div>
        </div>

        <div class="card">
          <h2>Tournament schedule</h2>
          <div class="sched">${exists ? schedHtml : '<div class="empty">Create your profile first, then add tournaments.</div>'}</div>
          ${exists ? `
          <div style="margin-top:18px; border-top:1px solid var(--line-soft); padding-top:16px;">
            <div class="add-form">
              <div class="field"><label>Date</label><input id="t-date" type="date" /></div>
              <div class="field"><label>Tournament</label><input id="t-name" type="text" placeholder="e.g. AJGA Junior Open" /></div>
              <div class="field wide"><label>Location</label><input id="t-location" type="text" placeholder="Course, City, State" /></div>
              <div class="field wide"><label>Result (optional)</label><input id="t-result" type="text" placeholder="e.g. T-4 / 71-69" /></div>
            </div>
            <div class="msg err" id="addMsg"></div>
            <div class="form-actions"><button class="btn primary" id="addEvent">Add tournament</button></div>
          </div>` : ''}
        </div>`;

      document.getElementById('saveProfile').onclick = saveProfile;
      const addBtn = document.getElementById('addEvent');
      if (addBtn) addBtn.onclick = addEvent;
    }

    async function saveProfile() {
      const uid = session.user.id;
      const name = document.getElementById('f-name').value.trim();
      const msg = document.getElementById('saveMsg');
      const btn = document.getElementById('saveProfile');
      if (!name) { msg.className = 'msg err'; msg.textContent = 'Name is required.'; return; }
      const gradRaw = document.getElementById('f-grad').value;
      const row = {
        id: uid,
        name,
        hometown: document.getElementById('f-hometown').value.trim() || null,
        grad_year: gradRaw ? parseInt(gradRaw, 10) : null,
        commitment: document.getElementById('f-commit').value.trim() || null,
        height: document.getElementById('f-height').value.trim() || null,
        weight: document.getElementById('f-weight').value.trim() || null,
        updated_at: new Date().toISOString()
      };
      btn.disabled = true; btn.textContent = 'Saving…';
      const { error } = await sb.from('profiles').upsert(row);
      btn.disabled = false;
      if (error) { msg.className = 'msg err'; msg.textContent = error.message; btn.textContent = 'Save details'; return; }
      renderMyProfile();
    }

    async function addEvent() {
      const uid = session.user.id;
      const name = document.getElementById('t-name').value.trim();
      const date = document.getElementById('t-date').value;
      const msg = document.getElementById('addMsg');
      if (!name) { msg.textContent = 'Give the tournament a name.'; return; }
      if (!date) { msg.textContent = 'Pick a date.'; return; }
      const row = {
        profile_id: uid, name, date,
        location: document.getElementById('t-location').value.trim() || null,
        result: document.getElementById('t-result').value.trim() || null
      };
      const { error } = await sb.from('tournaments').insert(row);
      if (error) { msg.textContent = error.message; return; }
      renderMyProfile();
    }

    async function removeEvent(eventId) {
      await sb.from('tournaments').delete().eq('id', eventId);
      renderMyProfile();
    }

    // --- Global click delegation for [data-goto] / [data-del] ---
    document.body.addEventListener('click', e => {
      const gotoEl = e.target.closest('[data-goto]');
      const delEl = e.target.closest('[data-del]');
      if (delEl) { removeEvent(delEl.getAttribute('data-del')); return; }
      if (gotoEl) { go(gotoEl.getAttribute('data-goto')); return; }
    });
    document.getElementById('brand').onclick = () => go('#/');

    // --- Init ---
    (async function init() {
      const { data } = await sb.auth.getSession();
      session = data.session;
      sb.auth.onAuthStateChange((_e, s) => { session = s; updateNav(); });
      window.addEventListener('hashchange', route);
      route();
    })();
  })();
  </script>
</body>
</html>
