<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Up Next Golf · Player Directory</title>
<style>
  :root {
    --bg:#0f1117; --bg-soft:#171a23; --bg-card:#151824; --fg:#e8eaf0; --muted:#8b90a0;
    --faint:#565c70; --accent:#6ee7b7; --accent-dim:#2b6a52; --accent-ink:#06281c;
    --line:#262a38; --line-soft:#20242f; --danger:#f87171; --warn:#fbbf24; --gold:#fcd34d;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    background:radial-gradient(1200px 800px at 50% -10%, #1b2030 0%, var(--bg) 55%);
    color:var(--fg); min-height:100%; -webkit-font-smoothing:antialiased; line-height:1.45;
  }
  button, input, textarea, select { font-family:inherit; }
  .wrap { max-width:820px; margin:0 auto; padding:24px 20px 80px; }

  header.top { display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; gap:12px; }
  .brand { font-size:13px; letter-spacing:.32em; text-transform:uppercase; color:var(--muted); cursor:pointer; }
  .brand b { color:var(--accent); font-weight:600; }
  #nav { display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }

  h1.page-title { font-size:24px; font-weight:600; margin-bottom:4px; }
  .subtle { color:var(--muted); font-size:14px; }
  .intro { color:var(--muted); font-size:14px; margin:8px 0 18px; max-width:60ch; }

  .search { width:100%; background:var(--bg-soft); border:1px solid var(--line); border-radius:12px;
    color:var(--fg); font-size:15px; padding:11px 14px; outline:none; margin:8px 0 18px; transition:border-color .2s, box-shadow .2s; }
  .search::placeholder { color:var(--faint); }
  .search:focus { border-color:var(--accent-dim); box-shadow:0 0 0 3px rgba(110,231,183,.12); }

  .list { display:flex; flex-direction:column; gap:10px; }
  .row { display:flex; align-items:center; gap:14px; background:var(--bg-card); border:1px solid var(--line-soft);
    border-radius:14px; padding:13px 16px; cursor:pointer; transition:border-color .15s, transform .08s, background .15s; }
  .row:hover { border-color:#33394a; background:#181c28; }
  .row:active { transform:scale(.995); }
  .avatar { width:44px; height:44px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg,#1f2634,#242c3d); border:1px solid var(--line); color:var(--accent); font-weight:600; font-size:15px; }
  .avatar.lg { width:64px; height:64px; font-size:22px; }
  .row .who { flex:1; min-width:0; }
  .row .name { font-size:16px; font-weight:500; }
  .row .meta { font-size:13px; color:var(--muted); margin-top:1px; }
  .tag { font-size:11px; letter-spacing:.06em; text-transform:uppercase; padding:4px 9px; border-radius:20px; border:1px solid var(--line); color:var(--muted); white-space:nowrap; }
  .tag.you { color:var(--accent-ink); background:var(--accent); border-color:var(--accent); font-weight:700; }
  .tag.open { color:var(--gold); border-color:#4a4020; }
  .empty { color:var(--faint); text-align:center; padding:44px 16px; font-size:14px; }
  .empty .btn { margin-top:14px; }

  .btn { font-size:14px; font-weight:500; border:1px solid var(--line); background:var(--bg-soft); color:var(--fg);
    padding:10px 18px; border-radius:11px; cursor:pointer; transition:transform .08s, background .15s, border-color .15s, opacity .15s; white-space:nowrap; }
  .btn:hover { border-color:#3a4050; background:#1e222d; }
  .btn:active { transform:scale(.97); }
  .btn.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600; }
  .btn.primary:hover { background:#7ff0c4; }
  .btn.ghost { background:transparent; }
  .btn.danger { color:var(--danger); border-color:#4a2626; }
  .btn.danger:hover { background:rgba(248,113,113,.08); }
  .btn.sm { padding:7px 12px; font-size:13px; border-radius:9px; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .link { background:none; border:none; color:var(--muted); cursor:pointer; font-size:14px; padding:4px 0; }
  .link:hover { color:var(--fg); }

  .back { margin-bottom:18px; }
  .profile-head { display:flex; align-items:center; gap:16px; margin-bottom:14px; flex-wrap:wrap; }
  .profile-head h1 { font-size:26px; font-weight:600; }
  .profile-head .meta { color:var(--muted); font-size:14px; margin-top:2px; }

  .statrow { display:flex; gap:10px; flex-wrap:wrap; margin:6px 0; }
  .statchip { border:1px solid var(--line-soft); background:var(--bg-soft); border-radius:11px; padding:8px 12px; min-width:92px; }
  .statchip .k { font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); }
  .statchip .v { font-size:15px; font-weight:600; margin-top:2px; }
  .statchip .v.accent { color:var(--accent); }

  .card { background:var(--bg-card); border:1px solid var(--line-soft); border-radius:16px; padding:20px; margin-top:20px; }
  .card h2 { font-size:13px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin-bottom:14px; }

  .field-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .field label { display:block; font-size:12px; color:var(--muted); margin-bottom:5px; letter-spacing:.04em; }
  .field input, .field textarea, .field select { width:100%; background:var(--bg); border:1px solid var(--line);
    border-radius:10px; color:var(--fg); font-size:14px; padding:10px 12px; outline:none; transition:border-color .2s; }
  .field input:focus, .field textarea:focus, .field select:focus { border-color:var(--accent-dim); }
  .field.full { grid-column:1 / -1; }
  .field textarea { resize:vertical; min-height:64px; }
  .req { color:var(--accent); }

  .sched { display:flex; flex-direction:column; gap:10px; }
  .event { display:flex; align-items:center; gap:14px; border:1px solid var(--line-soft); border-radius:12px; padding:12px 14px; background:var(--bg-soft); }
  .event.past { opacity:.55; }
  .event .date { flex:none; text-align:center; width:52px; border-right:1px solid var(--line); padding-right:12px; }
  .event .date .m { font-size:11px; text-transform:uppercase; color:var(--accent); letter-spacing:.08em; }
  .event .date .d { font-size:20px; font-weight:600; }
  .event .date .y { font-size:11px; color:var(--faint); }
  .event .body { flex:1; min-width:0; }
  .event .t-name { font-size:15px; font-weight:500; }
  .event .t-loc { font-size:13px; color:var(--muted); }
  .event .t-result { font-size:12px; color:var(--accent); margin-top:2px; }

  .add-form { display:grid; grid-template-columns:150px 1fr; gap:12px; margin-top:8px; }
  .add-form .field.wide { grid-column:1 / -1; }
  .form-actions { display:flex; gap:10px; margin-top:16px; justify-content:flex-end; align-items:center; }
  .msg { font-size:13px; min-height:16px; }
  .msg.err { color:var(--danger); }
  .msg.ok { color:var(--accent); }

  /* Auth / claim card */
  .auth-card { max-width:440px; margin:26px auto; background:var(--bg-card); border:1px solid var(--line); border-radius:18px; padding:26px; }
  .auth-card h1 { font-size:20px; margin-bottom:6px; text-align:center; }
  .auth-card p.sub { color:var(--muted); font-size:13px; text-align:center; margin-bottom:18px; }
  .auth-card .field { margin-bottom:14px; }
  .auth-card .btn { width:100%; justify-content:center; }
  .otp-input { width:100%; background:var(--bg); border:1px solid var(--line); border-radius:12px; color:var(--fg);
    font-size:22px; text-align:center; letter-spacing:.4em; padding:14px; outline:none; }
  .otp-input:focus { border-color:var(--accent-dim); box-shadow:0 0 0 3px rgba(110,231,183,.12); }
  .steps { display:flex; gap:6px; justify-content:center; margin-bottom:16px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--line); }
  .dot.on { background:var(--accent); }

  /* Admin */
  .admin-table { width:100%; border-collapse:collapse; font-size:14px; }
  .admin-table th { text-align:left; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); padding:8px 10px; border-bottom:1px solid var(--line); }
  .admin-table td { padding:10px; border-bottom:1px solid var(--line-soft); vertical-align:middle; }
  .code-pill { font-family:ui-monospace,Menlo,monospace; background:#0c0e14; border:1px solid var(--line); border-radius:7px; padding:3px 8px; letter-spacing:.12em; }
  .new-code { text-align:center; padding:16px; border:1px dashed var(--accent-dim); border-radius:12px; background:rgba(110,231,183,.05); margin-top:14px; }
  .new-code .big { font-family:ui-monospace,Menlo,monospace; font-size:26px; letter-spacing:.2em; color:var(--accent); margin:6px 0; }

  .notice { border:1px solid var(--line); background:var(--bg-soft); border-radius:14px; padding:18px 20px; margin-top:16px; color:var(--muted); font-size:14px; }
  .notice.warn { border-color:#3a3416; background:rgba(251,191,36,.06); color:var(--warn); }
  .notice code { background:#0c0e14; border:1px solid var(--line); border-radius:6px; padding:1px 6px; color:var(--fg); }
  .notice ol { margin:10px 0 0 18px; color:var(--fg); } .notice ol li { margin:6px 0; }
  .spinner { color:var(--faint); text-align:center; padding:44px; font-size:14px; }
  .hero-cta { display:flex; gap:10px; flex-wrap:wrap; margin:16px 0 24px; }

  @media (max-width:560px) { .field-grid { grid-template-columns:1fr; } .add-form { grid-template-columns:1fr; } .admin-table .hide-sm { display:none; } }
</style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand" id="brand">Up Next <b>Golf</b></div>
      <div id="nav"></div>
    </header>
    <main id="view"><div class="spinner">Loading…</div></main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=5"></script>
  <script>
  (function () {
    "use strict";
    const view = document.getElementById('view');
    const nav = document.getElementById('nav');
    const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const initials = n => (n||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('') || '?';
    const parseDate = iso => { const [y,m,d]=iso.split('-').map(Number); return {y,m:m-1,d}; };
    const classOf = y => y ? ('Class of '+y) : 'Class TBD';
    const today = () => new Date().toISOString().slice(0,10);

    if (!(window.SUPABASE_URL && window.SUPABASE_ANON_KEY &&
          !/PASTE_/.test(window.SUPABASE_URL) && !/PASTE_/.test(window.SUPABASE_ANON_KEY))) {
      nav.innerHTML = '';
      view.innerHTML = '<div class="notice warn">Not connected to the database — check config.js.</div>';
      return;
    }
    const sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

    let session = null;
    let isAdmin = false;
    // claim flow state
    let claim = { stage:'search', profileId:null, name:'', code:'', email:'' };

    function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }

    function updateNav() {
      if (session) {
        let h = '<button class="btn sm" id="nav-me">My profile</button>';
        if (isAdmin) h += '<button class="btn sm" id="nav-admin">Admin</button>';
        h += '<button class="btn sm ghost" id="nav-out">Sign out</button>';
        nav.innerHTML = h;
        document.getElementById('nav-me').onclick = () => go('#/me');
        if (isAdmin) document.getElementById('nav-admin').onclick = () => go('#/admin');
        document.getElementById('nav-out').onclick = async () => { await sb.auth.signOut(); isAdmin=false; go('#/'); };
      } else {
        nav.innerHTML = '<button class="btn sm primary" id="nav-claim">Claim your profile</button><button class="btn sm ghost" id="nav-in">Sign in</button>';
        document.getElementById('nav-claim').onclick = () => go('#/claim');
        document.getElementById('nav-in').onclick = () => go('#/login');
      }
    }
    function errorBox(e){ return '<div class="notice warn">Something went wrong: '+esc(e.message||e)+'</div>'; }

    function route() {
      updateNav();
      const hash = location.hash || '#/';
      if (hash.startsWith('#/p/')) return renderPublicProfile(decodeURIComponent(hash.slice(4)));
      if (hash === '#/claim')  return renderClaim();
      if (hash === '#/login')  return session ? go('#/me') : renderLogin();
      if (hash === '#/me')     return session ? renderMe() : renderLogin();
      if (hash === '#/admin')  return session ? renderAdmin() : renderLogin();
      return renderDirectory();
    }

    // ---------- Directory (claimed only) ----------
    async function renderDirectory() {
      view.innerHTML =
        '<h1 class="page-title">Player directory</h1>'+
        '<p class="intro">Junior golfers who have claimed and built their own profile.</p>'+
        (session ? '' : '<div class="hero-cta"><button class="btn primary" id="cta-claim">Claim your profile</button><button class="btn" id="cta-in">Sign in</button></div>')+
        '<input class="search" id="search" type="text" placeholder="Search by name, hometown, or commitment…" autocomplete="off" />'+
        '<div class="list" id="list"><div class="spinner">Loading players…</div></div>';
      if (!session) {
        document.getElementById('cta-claim').onclick = () => go('#/claim');
        document.getElementById('cta-in').onclick = () => go('#/login');
      }
      const { data, error } = await sb.from('profiles')
        .select('id,name,hometown,grad_year,commitment')
        .not('claimed_by','is',null).order('name',{ascending:true});
      const list = document.getElementById('list');
      if (error) { list.innerHTML = errorBox(error); return; }
      const players = data || [];
      const draw = q => {
        q = (q||'').trim().toLowerCase();
        if (!players.length) {
          list.innerHTML = '<div class="empty">No players yet.<br>Are you a listed golfer? '+
            '<button class="btn primary" id="e-claim">Claim your profile</button></div>';
          document.getElementById('e-claim').onclick = () => go('#/claim'); return;
        }
        const shown = players.filter(p => !q || ((p.name||'')+' '+(p.hometown||'')+' '+(p.commitment||'')).toLowerCase().includes(q));
        list.innerHTML = shown.length ? shown.map(p =>
          '<div class="row" data-goto="#/p/'+encodeURIComponent(p.id)+'">'+
            '<div class="avatar">'+esc(initials(p.name))+'</div>'+
            '<div class="who"><div class="name">'+esc(p.name)+'</div>'+
            '<div class="meta">'+esc(classOf(p.grad_year))+(p.hometown?' · '+esc(p.hometown):'')+(p.commitment?' · '+esc(p.commitment):'')+'</div></div>'+
            (session && p.id===session._pid ? '<span class="tag you">You</span>' : '')+
          '</div>').join('') : '<div class="empty">No players match your search.</div>';
      };
      draw('');
      const s = document.getElementById('search');
      s.addEventListener('input', () => draw(s.value));
    }

    // ---------- Public profile ----------
    async function renderPublicProfile(id) {
      view.innerHTML = '<button class="link back" data-goto="#/">← Back to directory</button><div class="spinner">Loading profile…</div>';
      const { data:p, error } = await sb.from('profiles').select('*, tournaments(*)').eq('id',id).maybeSingle();
      if (error || !p) { view.innerHTML = '<button class="link back" data-goto="#/">← Back to directory</button><div class="notice warn">Profile not found.</div>'; return; }
      const mine = session && session.user.id === p.claimed_by;
      const sched = (p.tournaments||[]).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
      view.innerHTML =
        '<button class="link back" data-goto="#/">← Back to directory</button>'+
        '<div class="profile-head"><div class="avatar lg">'+esc(initials(p.name))+'</div>'+
          '<div style="flex:1;min-width:200px;"><h1>'+esc(p.name)+'</h1>'+
          '<div class="meta">'+esc(classOf(p.grad_year))+(p.hometown?' · '+esc(p.hometown):'')+'</div></div>'+
          (mine?'<button class="btn primary" data-goto="#/me">Edit my profile</button>':'')+'</div>'+
        '<div class="statrow">'+
          '<div class="statchip"><div class="k">Commitment</div><div class="v accent">'+esc(p.commitment||'Uncommitted')+'</div></div>'+
          '<div class="statchip"><div class="k">Height</div><div class="v">'+esc(p.height||'—')+'</div></div>'+
          '<div class="statchip"><div class="k">Weight</div><div class="v">'+esc(p.weight||'—')+'</div></div>'+
        '</div>'+
        '<div class="card"><h2>Tournament schedule</h2><div class="sched">'+scheduleHtml(sched,false)+'</div></div>';
    }

    function scheduleHtml(sched, owner) {
      if (!sched.length) return '<div class="empty">'+(owner?'No tournaments yet — add your first below.':'No tournaments posted yet.')+'</div>';
      const t = today();
      return sched.map(ev => {
        const past = ev.date && ev.date < t;
        const d = ev.date ? parseDate(ev.date) : null;
        const datebox = d ? '<div class="date"><div class="m">'+MONTHS[d.m]+'</div><div class="d">'+d.d+'</div><div class="y">'+d.y+'</div></div>'
                          : '<div class="date"><div class="m">TBD</div></div>';
        return '<div class="event '+(past?'past':'')+'">'+datebox+
          '<div class="body"><div class="t-name">'+esc(ev.name)+'</div><div class="t-loc">'+(esc(ev.location)||'—')+'</div>'+
          (ev.result?'<div class="t-result">Result: '+esc(ev.result)+'</div>':'')+'</div>'+
          (owner?'<button class="btn danger sm" data-del="'+esc(ev.id)+'">Remove</button>':'')+'</div>';
      }).join('');
    }

    // ---------- Claim flow (search → code+email → OTP) ----------
    function renderClaim() {
      if (claim.stage === 'verify') return renderClaimVerify();
      if (claim.stage === 'enter')  return renderClaimEnter();
      // search stage
      view.innerHTML =
        '<div class="auth-card"><h1>Claim your profile</h1>'+
        '<p class="sub">Search for your name to get started. You’ll need the claim code your organizer gave you.</p>'+
        '<div class="steps"><span class="dot on"></span><span class="dot"></span><span class="dot"></span></div>'+
        '<div class="field"><label>Your name</label><input id="c-search" type="text" placeholder="Start typing your name…" autocomplete="off" /></div>'+
        '<div id="c-results" class="list" style="margin-top:6px;"></div>'+
        '<div class="auth-toggle" style="text-align:center;margin-top:16px;font-size:13px;color:var(--muted);">Already claimed? <button class="link" id="c-signin" style="display:inline;color:var(--accent);">Sign in</button></div>'+
        '</div>';
      document.getElementById('c-signin').onclick = () => go('#/login');
      const s = document.getElementById('c-search');
      let t; s.addEventListener('input', () => { clearTimeout(t); t = setTimeout(()=>doClaimSearch(s.value), 250); });
      s.focus();
    }
    async function doClaimSearch(q) {
      const box = document.getElementById('c-results'); if (!box) return;
      if ((q||'').trim().length < 2) { box.innerHTML=''; return; }
      const { data, error } = await sb.rpc('find_claimable', { q: q.trim() });
      if (error) { box.innerHTML = errorBox(error); return; }
      if (!data || !data.length) { box.innerHTML = '<div class="empty" style="padding:18px;">No unclaimed golfer found by that name. Check spelling, or ask your organizer.</div>'; return; }
      box.innerHTML = data.map(p =>
        '<div class="row" data-pick="'+esc(p.id)+'" data-name="'+esc(p.name)+'">'+
          '<div class="avatar">'+esc(initials(p.name))+'</div>'+
          '<div class="who"><div class="name">'+esc(p.name)+'</div><div class="meta">'+esc(classOf(p.grad_year))+'</div></div>'+
          '<span class="tag open">Claim</span></div>').join('');
    }
    function renderClaimEnter() {
      view.innerHTML =
        '<div class="auth-card"><h1>Claim: '+esc(claim.name)+'</h1>'+
        '<p class="sub">Enter the claim code you were given and your email. We’ll send a 6-digit verification code to your email.</p>'+
        '<div class="steps"><span class="dot"></span><span class="dot on"></span><span class="dot"></span></div>'+
        '<div class="field"><label>Claim code</label><input id="e-code" type="text" placeholder="e.g. 7F3K9Q" autocomplete="off" style="text-transform:uppercase;letter-spacing:.15em;" /></div>'+
        '<div class="field"><label>Your email</label><input id="e-email" type="email" placeholder="you@email.com" autocomplete="email" /></div>'+
        '<div class="msg err" id="e-msg" style="margin-bottom:12px;"></div>'+
        '<button class="btn primary" id="e-send">Send verification code</button>'+
        '<div class="auth-toggle" style="text-align:center;margin-top:14px;"><button class="link" id="e-back">← Search a different name</button></div></div>';
      document.getElementById('e-back').onclick = () => { claim.stage='search'; renderClaim(); };
      document.getElementById('e-send').onclick = sendClaimCode;
    }
    async function sendClaimCode() {
      const code = document.getElementById('e-code').value.trim();
      const email = document.getElementById('e-email').value.trim();
      const msg = document.getElementById('e-msg'), btn = document.getElementById('e-send');
      msg.textContent = '';
      if (!code) { msg.textContent = 'Enter your claim code.'; return; }
      if (!email) { msg.textContent = 'Enter your email.'; return; }
      btn.disabled = true; btn.textContent = 'Sending…';
      const { error } = await sb.auth.signInWithOtp({ email });
      btn.disabled = false; btn.textContent = 'Send verification code';
      if (error) { msg.textContent = error.message; return; }
      claim.code = code; claim.email = email; claim.stage = 'verify';
      renderClaim();
    }
    function renderClaimVerify() {
      view.innerHTML =
        '<div class="auth-card"><h1>Enter your code</h1>'+
        '<p class="sub">We emailed a 6-digit code to <b>'+esc(claim.email)+'</b>. Enter it below to finish claiming <b>'+esc(claim.name)+'</b>.</p>'+
        '<div class="steps"><span class="dot"></span><span class="dot"></span><span class="dot on"></span></div>'+
        '<div class="field"><input id="v-otp" class="otp-input" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code" /></div>'+
        '<div class="msg err" id="v-msg" style="margin:6px 0 12px;"></div>'+
        '<button class="btn primary" id="v-go">Verify & claim</button>'+
        '<div class="auth-toggle" style="text-align:center;margin-top:14px;"><button class="link" id="v-back">← Back</button></div></div>';
      document.getElementById('v-back').onclick = () => { claim.stage='enter'; renderClaim(); };
      document.getElementById('v-go').onclick = verifyClaim;
      const el = document.getElementById('v-otp'); el.focus();
      el.addEventListener('keydown', e => { if (e.key==='Enter') verifyClaim(); });
    }
    async function verifyClaim() {
      const token = document.getElementById('v-otp').value.trim();
      const msg = document.getElementById('v-msg'), btn = document.getElementById('v-go');
      msg.className='msg err'; msg.textContent='';
      if (token.length < 6) { msg.textContent='Enter the 6-digit code.'; return; }
      btn.disabled = true; btn.textContent = 'Verifying…';
      const { error:vErr } = await sb.auth.verifyOtp({ email: claim.email, token, type: 'email' });
      if (vErr) { btn.disabled=false; btn.textContent='Verify & claim'; msg.textContent = vErr.message; return; }
      // Now signed in — attempt to claim with the code
      const { data, error } = await sb.rpc('claim_profile', { p_profile_id: claim.profileId, p_code: claim.code });
      if (error) { btn.disabled=false; btn.textContent='Verify & claim'; msg.textContent = error.message; return; }
      if (!data || !data.ok) {
        btn.disabled=false; btn.textContent='Verify & claim';
        msg.textContent = (data && data.error) || 'Could not claim this profile.'; return;
      }
      claim = { stage:'search', profileId:null, name:'', code:'', email:'' };
      go('#/me');
    }

    // ---------- Login (returning golfer / admin) via OTP ----------
    let loginState = { stage:'email', email:'' };
    function renderLogin() {
      if (loginState.stage === 'otp') {
        view.innerHTML =
          '<div class="auth-card"><h1>Enter your code</h1>'+
          '<p class="sub">We emailed a 6-digit code to <b>'+esc(loginState.email)+'</b>.</p>'+
          '<div class="field"><input id="l-otp" class="otp-input" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code" /></div>'+
          '<div class="msg err" id="l-msg" style="margin:6px 0 12px;"></div>'+
          '<button class="btn primary" id="l-verify">Verify & sign in</button>'+
          '<div class="auth-toggle" style="text-align:center;margin-top:14px;"><button class="link" id="l-back">← Use a different email</button></div></div>';
        document.getElementById('l-back').onclick = () => { loginState.stage='email'; renderLogin(); };
        document.getElementById('l-verify').onclick = verifyLogin;
        const el = document.getElementById('l-otp'); el.focus();
        el.addEventListener('keydown', e => { if (e.key==='Enter') verifyLogin(); });
        return;
      }
      view.innerHTML =
        '<div class="auth-card"><h1>Sign in</h1>'+
        '<p class="sub">Enter your email and we’ll send a 6-digit code — no password needed.</p>'+
        '<div class="field"><label>Email</label><input id="l-email" type="email" placeholder="you@email.com" autocomplete="email" /></div>'+
        '<div class="msg err" id="l-msg" style="margin-bottom:12px;"></div>'+
        '<button class="btn primary" id="l-send">Send code</button>'+
        '<div class="auth-toggle" style="text-align:center;margin-top:14px;font-size:13px;color:var(--muted);">Haven’t claimed yet? <button class="link" id="l-claim" style="display:inline;color:var(--accent);">Claim your profile</button></div></div>';
      document.getElementById('l-claim').onclick = () => go('#/claim');
      document.getElementById('l-send').onclick = sendLoginCode;
      document.getElementById('l-email').focus();
    }
    async function sendLoginCode() {
      const email = document.getElementById('l-email').value.trim();
      const msg = document.getElementById('l-msg'), btn = document.getElementById('l-send');
      msg.textContent='';
      if (!email) { msg.textContent='Enter your email.'; return; }
      btn.disabled=true; btn.textContent='Sending…';
      const { error } = await sb.auth.signInWithOtp({ email });
      btn.disabled=false; btn.textContent='Send code';
      if (error) { msg.textContent = error.message; return; }
      loginState.email = email; loginState.stage='otp'; renderLogin();
    }
    async function verifyLogin() {
      const token = document.getElementById('l-otp').value.trim();
      const msg = document.getElementById('l-msg'), btn = document.getElementById('l-verify');
      if (token.length<6) { msg.textContent='Enter the 6-digit code.'; return; }
      btn.disabled=true; btn.textContent='Verifying…';
      const { error } = await sb.auth.verifyOtp({ email: loginState.email, token, type:'email' });
      if (error) { btn.disabled=false; btn.textContent='Verify & sign in'; msg.textContent = error.message; return; }
      loginState = { stage:'email', email:'' };
      go('#/me');
    }

    // ---------- My profile (editor) ----------
    async function renderMe() {
      view.innerHTML = '<div class="spinner">Loading your profile…</div>';
      const uid = session.user.id;
      const { data:p, error } = await sb.from('profiles').select('*, tournaments(*)').eq('claimed_by', uid).maybeSingle();
      if (error) { view.innerHTML = errorBox(error); return; }
      if (!p) {
        view.innerHTML = '<h1 class="page-title">No profile yet</h1>'+
          '<div class="notice">You’re signed in, but you haven’t claimed a golfer profile yet.'+
          '<div style="margin-top:12px;"><button class="btn primary" id="np-claim">Claim your profile</button>'+
          (isAdmin?' <button class="btn" id="np-admin">Go to Admin</button>':'')+'</div></div>';
        document.getElementById('np-claim').onclick = () => go('#/claim');
        if (isAdmin) document.getElementById('np-admin').onclick = () => go('#/admin');
        return;
      }
      session._pid = p.id;
      const g = (k) => esc(p[k]!=null ? p[k] : '');
      const sched = (p.tournaments||[]).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
      view.innerHTML =
        '<button class="link back" data-goto="#/">← Back to directory</button>'+
        '<h1 class="page-title">Edit your profile</h1>'+
        '<p class="intro">Signed in as '+esc(session.user.email)+'. Only you can edit this.</p>'+
        '<div class="card"><h2>Your details</h2><div class="field-grid">'+
          '<div class="field"><label>Name <span class="req">*</span></label><input id="f-name" type="text" value="'+g('name')+'" /></div>'+
          '<div class="field"><label>Hometown</label><input id="f-hometown" type="text" value="'+g('hometown')+'" placeholder="City, ST" /></div>'+
          '<div class="field"><label>Graduating year</label><input id="f-grad" type="number" min="2024" max="2035" value="'+g('grad_year')+'" placeholder="e.g. 2027" /></div>'+
          '<div class="field"><label>College commitment</label><input id="f-commit" type="text" value="'+g('commitment')+'" placeholder="School, or Uncommitted" /></div>'+
          '<div class="field"><label>Height</label><input id="f-height" type="text" value="'+g('height')+'" placeholder="e.g. 5&#39;11&quot;" /></div>'+
          '<div class="field"><label>Weight</label><input id="f-weight" type="text" value="'+g('weight')+'" placeholder="e.g. 160 lbs" /></div>'+
        '</div><div class="form-actions"><span class="msg ok" id="saveMsg"></span><button class="btn primary" id="saveProfile">Save details</button></div></div>'+
        '<div class="card"><h2>Tournament schedule</h2><div class="sched">'+scheduleHtml(sched,true)+'</div>'+
          '<div style="margin-top:18px;border-top:1px solid var(--line-soft);padding-top:16px;"><div class="add-form">'+
            '<div class="field"><label>Date</label><input id="t-date" type="date" /></div>'+
            '<div class="field"><label>Tournament</label><input id="t-name" type="text" placeholder="e.g. AJGA Junior Open" /></div>'+
            '<div class="field wide"><label>Location</label><input id="t-location" type="text" placeholder="Course, City, State" /></div>'+
            '<div class="field wide"><label>Result (optional)</label><input id="t-result" type="text" placeholder="e.g. T-4 / 71-69" /></div>'+
          '</div><div class="msg err" id="addMsg"></div><div class="form-actions"><button class="btn primary" id="addEvent">Add tournament</button></div></div></div>';
      document.getElementById('saveProfile').onclick = () => saveProfile(p.id);
      document.getElementById('addEvent').onclick = () => addEvent(p.id);
    }
    async function saveProfile(pid) {
      const name = document.getElementById('f-name').value.trim();
      const msg = document.getElementById('saveMsg'), btn = document.getElementById('saveProfile');
      if (!name) { msg.className='msg err'; msg.textContent='Name is required.'; return; }
      const gradRaw = document.getElementById('f-grad').value;
      const patch = {
        name,
        hometown: document.getElementById('f-hometown').value.trim() || null,
        grad_year: gradRaw ? parseInt(gradRaw,10) : null,
        commitment: document.getElementById('f-commit').value.trim() || null,
        height: document.getElementById('f-height').value.trim() || null,
        weight: document.getElementById('f-weight').value.trim() || null,
        updated_at: new Date().toISOString()
      };
      btn.disabled=true; btn.textContent='Saving…';
      const { error } = await sb.from('profiles').update(patch).eq('id', pid);
      btn.disabled=false; btn.textContent='Save details';
      if (error) { msg.className='msg err'; msg.textContent=error.message; return; }
      renderMe();
    }
    async function addEvent(pid) {
      const name = document.getElementById('t-name').value.trim();
      const date = document.getElementById('t-date').value;
      const msg = document.getElementById('addMsg');
      if (!name) { msg.textContent='Give the tournament a name.'; return; }
      if (!date) { msg.textContent='Pick a date.'; return; }
      const row = { profile_id: pid, name, date,
        location: document.getElementById('t-location').value.trim() || null,
        result: document.getElementById('t-result').value.trim() || null };
      const { error } = await sb.from('tournaments').insert(row);
      if (error) { msg.textContent = error.message; return; }
      renderMe();
    }
    async function removeEvent(id) { await sb.from('tournaments').delete().eq('id', id); renderMe(); }

    // ---------- Admin ----------
    async function renderAdmin() {
      if (!isAdmin) { view.innerHTML = '<div class="notice warn">You’re not an admin on this account.</div>'; return; }
      view.innerHTML =
        '<button class="link back" data-goto="#/">← Back to directory</button>'+
        '<h1 class="page-title">Admin · roster</h1>'+
        '<p class="intro">Add a golfer, then give them their claim code privately. They claim by searching their name + entering the code + verifying their email.</p>'+
        '<div class="card"><h2>Add a golfer</h2><div class="field-grid">'+
          '<div class="field"><label>Name <span class="req">*</span></label><input id="a-name" type="text" placeholder="First Last" /></div>'+
          '<div class="field"><label>Graduating year</label><input id="a-grad" type="number" min="2024" max="2035" placeholder="e.g. 2027" /></div>'+
        '</div><div class="msg err" id="a-msg"></div>'+
        '<div class="form-actions"><button class="btn primary" id="a-add">Add golfer</button></div>'+
        '<div id="a-newcode"></div></div>'+
        '<div class="card"><h2>Roster</h2><div id="a-list"><div class="spinner">Loading…</div></div></div>';
      document.getElementById('a-add').onclick = adminAdd;
      loadRoster();
    }
    async function adminAdd() {
      const name = document.getElementById('a-name').value.trim();
      const gradRaw = document.getElementById('a-grad').value;
      const msg = document.getElementById('a-msg'), btn = document.getElementById('a-add');
      msg.textContent='';
      if (!name) { msg.textContent='Enter a name.'; return; }
      btn.disabled=true; btn.textContent='Adding…';
      const { data, error } = await sb.rpc('admin_add_golfer', { p_name:name, p_grad_year: gradRaw?parseInt(gradRaw,10):null });
      btn.disabled=false; btn.textContent='Add golfer';
      if (error) { msg.textContent=error.message; return; }
      if (!data || !data.ok) { msg.textContent = (data&&data.error)||'Could not add.'; return; }
      document.getElementById('a-name').value=''; document.getElementById('a-grad').value='';
      document.getElementById('a-newcode').innerHTML =
        '<div class="new-code">Claim code for <b>'+esc(name)+'</b><div class="big">'+esc(data.code)+'</div>'+
        '<div style="font-size:12px;color:var(--muted);">Give this to the golfer privately. They’ll need it to claim.</div></div>';
      loadRoster();
    }
    async function loadRoster() {
      const box = document.getElementById('a-list');
      const { data, error } = await sb.from('profiles').select('id,name,grad_year,claimed_by,claimed_at, claim_codes(code)').order('created_at',{ascending:false});
      if (error) { box.innerHTML = errorBox(error); return; }
      if (!data || !data.length) { box.innerHTML = '<div class="empty">No golfers yet — add your first above.</div>'; return; }
      box.innerHTML = '<div style="overflow-x:auto;"><table class="admin-table"><thead><tr>'+
        '<th>Name</th><th class="hide-sm">Grad</th><th>Status</th><th>Code</th><th></th></tr></thead><tbody>'+
        data.map(p => {
          const claimed = !!p.claimed_by;
          const code = (p.claim_codes && p.claim_codes.code) ? p.claim_codes.code : '—';
          return '<tr><td>'+esc(p.name)+'</td>'+
            '<td class="hide-sm">'+(p.grad_year||'—')+'</td>'+
            '<td>'+(claimed?'<span class="tag you">Claimed</span>':'<span class="tag open">Unclaimed</span>')+'</td>'+
            '<td>'+(claimed?'—':'<span class="code-pill">'+esc(code)+'</span>')+'</td>'+
            '<td style="text-align:right;"><button class="btn danger sm" data-adel="'+esc(p.id)+'" data-aname="'+esc(p.name)+'">Delete</button></td></tr>';
        }).join('')+'</tbody></table></div>';
    }
    async function adminDelete(id, name) {
      if (!confirm('Delete '+name+'? This removes their roster entry'+(''))) return;
      const { error } = await sb.from('profiles').delete().eq('id', id);
      if (error) { alert(error.message); return; }
      loadRoster();
    }

    // ---------- delegation ----------
    document.body.addEventListener('click', e => {
      const pick = e.target.closest('[data-pick]');
      const del  = e.target.closest('[data-del]');
      const adel = e.target.closest('[data-adel]');
      const goEl = e.target.closest('[data-goto]');
      if (pick) { claim.profileId = pick.getAttribute('data-pick'); claim.name = pick.getAttribute('data-name'); claim.stage='enter'; renderClaim(); return; }
      if (del)  { removeEvent(del.getAttribute('data-del')); return; }
      if (adel) { adminDelete(adel.getAttribute('data-adel'), adel.getAttribute('data-aname')); return; }
      if (goEl) { go(goEl.getAttribute('data-goto')); return; }
    });
    document.getElementById('brand').onclick = () => go('#/');

    // ---------- init ----------
    async function refreshAdmin() {
      if (!session) { isAdmin=false; return; }
      try { const { data } = await sb.rpc('is_admin'); isAdmin = !!data; } catch(e) { isAdmin=false; }
    }
    (async function init() {
      const { data } = await sb.auth.getSession();
      session = data.session;
      await refreshAdmin();
      sb.auth.onAuthStateChange(async (_e, s) => { session = s; await refreshAdmin(); updateNav(); });
      window.addEventListener('hashchange', route);
      route();
    })();
  })();
  </script>
</body>
</html>
